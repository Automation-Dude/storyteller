<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Storyteller — Panel Lab</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"/>
<link rel="stylesheet" href="panel-lab.css"/>
</head>
<body>

<div class="shell" id="shell" data-theme="paper" data-sep="tone" data-navdark="false" data-screen-label="Panel Lab">

  <!-- ============ NAV ============ -->
  <aside class="nav">
    <div class="brand">Story<em>teller</em></div>
    <div class="item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 7.5 8 2.5l5.5 5v6h-11z"></path></svg>Home</div>
    <div class="item active"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 2.5h10v11H3z"></path><path d="M6 2.5v11"></path></svg>Books<span class="cnt">1000</span></div>
    <div class="sec">Library</div>
    <div class="item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 2.5 9.7 6l3.8.4-2.9 2.6.9 3.7L8 10.8l-3.5 1.9.9-3.7L2.5 6.4 6.3 6z"></path></svg>Rating<span class="cnt">15</span></div>
    <div class="item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3 4h10M3 8h10M3 12h7"></path></svg>Series<span class="cnt">4</span></div>
    <div class="item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="5.5" r="2.5"></circle><path d="M3.5 13.5c.6-2.6 2.3-4 4.5-4s3.9 1.4 4.5 4"></path></svg>Authors<span class="cnt">601</span></div>
    <div class="item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3.5" width="10" height="10" rx="1"></rect><path d="M3 6.5h10M6 2v3M10 2v3"></path></svg>Year<span class="cnt">24</span></div>
    <div class="item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 8 8 2.5h5.5V8L8 13.5z"></path><circle cx="10.5" cy="5.5" r="1"></circle></svg>Tags<span class="cnt">1156</span></div>
    <div class="item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"></circle><path d="M8 5v3.4l2.2 1.6"></path></svg>Status<span class="cnt">4</span></div>
  </aside>

  <!-- ============ CENTER ============ -->
  <main class="center">
    <header class="toolbar">
      <h1>Books</h1>
      <div class="search">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.5"></circle><path d="m10.5 10.5 3 3"></path></svg>
        Search books, authors, series…
      </div>
      <div class="views">
        <div class="vbtn active"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="4.5" height="4.5"></rect><rect x="9" y="2.5" width="4.5" height="4.5"></rect><rect x="2.5" y="9" width="4.5" height="4.5"></rect><rect x="9" y="9" width="4.5" height="4.5"></rect></svg></div>
        <div class="vbtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"></path></svg></div>
      </div>
    </header>
    <div class="grid-scroll" id="gridScroll">
      <div class="grid" id="grid"></div>
    </div>
  </main>

  <!-- ============ DETAIL ============ -->
  <aside class="detail" id="detail">
    <div class="rz" id="rz"><div class="pill"></div></div>
    <div class="detail-inner">
      <div class="detail-head">
        <div class="spacer"></div>
        <div class="hbtn"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="3.5" r="1"></circle><circle cx="8" cy="8" r="1"></circle><circle cx="8" cy="12.5" r="1"></circle></svg></div>
        <div class="hbtn" id="dClose"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="m4 4 8 8M12 4l-8 8"></path></svg></div>
      </div>
      <div class="detail-scroll">
        <div class="d-cover"><img id="dCover" alt=""/></div>
        <h2 class="d-title" id="dTitle"></h2>
        <div class="d-by">by <b id="dAuthor"></b></div>
        <div class="d-meta" id="dMeta"></div>
        <div class="d-hearts" id="dHearts"></div>
        <div class="d-actions">
          <button class="d-btn">Reading</button>
          <button class="d-btn primary">Read</button>
        </div>
        <div class="d-sec">Description</div>
        <p class="d-desc" id="dDesc"></p>
        <div class="d-sec">Book details</div>
        <div class="d-rows" id="dRows"></div>
      </div>
    </div>
  </aside>
</div>

<div id="tweaks-root"></div>

<script src="data.js"></script>
<script src="panel-lab-data.js"></script>
<script src="panel-lab.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "Linen",
  "sep": "Tone steps",
  "navDark": false,
  "resize": "Magnetic snap",
  "motion": 2,
  "keepInView": true,
  "cardMin": 170
}/*EDITMODE-END*/;

function PanelLabTweaks() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  React.useEffect(() => { window.PanelLab && window.PanelLab.apply(t); }, [t]);
  return (
    <TweaksPanel>
      <TweakSection label="Theme" />
      <TweakSelect label="Palette" value={t.theme}
        options={["Warm paper", "Porcelain", "Linen", "Charcoal (dark)"]}
        onChange={(v) => setTweak('theme', v)} />
      <TweakToggle label="Dark nav rail" value={t.navDark}
        onChange={(v) => setTweak('navDark', v)} />
      <TweakSection label="Panel separation" />
      <TweakRadio label="Style" value={t.sep}
        options={["Tone steps", "Floating", "Hairlines"]}
        onChange={(v) => setTweak('sep', v)} />
      <TweakSection label="Panel resize" />
      <TweakRadio label="While dragging" value={t.resize}
        options={["Fluid scale", "Live reflow", "Magnetic snap"]}
        onChange={(v) => setTweak('resize', v)} />
      <TweakToggle label="Keep clicked card in view" value={t.keepInView}
        onChange={(v) => setTweak('keepInView', v)} />
      <TweakSlider label="Motion" value={t.motion} min={0.4} max={2} step={0.1} unit="×"
        onChange={(v) => setTweak('motion', v)} />
      <TweakSlider label="Card min width" value={t.cardMin} min={130} max={240} step={5} unit="px"
        onChange={(v) => setTweak('cardMin', v)} />
    </TweaksPanel>
  );
}
ReactDOM.createRoot(document.getElementById('tweaks-root')).render(<PanelLabTweaks />);
</script>
</body>
</html>
