# AUTO-UPDATE IS CURRENTLY DISABLED (no signing key in CI yet). The commented
# blocks below build + upload the signed updater bundle and advance the
# .../storyteller-tauri/latest/latest.json feed. To re-enable:
#   1. add CI/CD variables (Settings → CI/CD → Variables, masked):
#        TAURI_SIGNING_PRIVATE_KEY          — CONTENTS of the signing key
#                                             (the _PATH variant is ignored)
#        TAURI_SIGNING_PRIVATE_KEY_PASSWORD — its password (omit if none)
#   2. uncomment the updater blocks in the macos job below
#   3. re-enable the updater plugin in applications/tauri/src-tauri/src/main.rs
#      (search for "auto-update disabled")
# latest.json is only advanced for stable versions, so prerelease tags produce
# installable artifacts without pushing an update to existing users.

.publish-tauri:
  stage: publish
  rules:
    - if:
        '$CI_COMMIT_TAG =~
        /^tauri-v?\d+\.\d+\.\d+(?:-(?:alpha|beta|rc|experimental|dev|test|preview)(?:\.\d+)?)?$/'
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
  cache:
    key:
      files:
        - applications/tauri/src-tauri/Cargo.lock
      prefix: $CI_JOB_NAME
    paths:
      - .cargo/registry
      - applications/tauri/src-tauri/target
  after_script:
    - rm -rf applications/tauri/src-tauri/target/release/bundle

publish-tauri-macos:
  extends: .publish-tauri
  # need big boi bc the small one runs oom
  tags: [saas-macos-large-m2pro]
  image: macos-26-xcode-26
  script:
    - export VERSION="${CI_COMMIT_TAG#tauri-}"
    - export VERSION="${VERSION#v}"
    # is important for auto-update
    - PKG_VERSION=$(node -p
      "require('./applications/tauri/package.json').version")
    - |
      if [ "$VERSION" != "$PKG_VERSION" ]; then
        echo "tag says $VERSION but applications/tauri/package.json says $PKG_VERSION"
        exit 1
      fi
    - curl -fsSL
      "https://nodejs.org/dist/v24.18.0/node-v24.18.0-darwin-arm64.tar.gz" | tar
      -xz -C "$HOME"
    - export PATH="$HOME/node-v24.18.0-darwin-arm64/bin:$PATH"
    - node --version
    - command -v cargo || (curl --proto '=https' --tlsv1.2 -sSf
      https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain
      stable)
    - export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
    - cargo --version
    - corepack enable
    - yarn install --immutable
    - cd applications/tauri
    - yarn fetch-binaries
    - yarn assemble-runtime
    - yarn tauri build
    - export TAURI_SIGNING_PRIVATE_KEY=${TAURI_SIGNING_PRIVATE_KEY}
    - export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}
    # updater build instead of the plain one above (requires the signing key):
    - yarn tauri build --config '{"bundle":{"createUpdaterArtifacts":true}}'
    - cd "$CI_PROJECT_DIR"
    # collect + rename to url-safe names
    - BUNDLE=applications/tauri/src-tauri/target/release/bundle
    - cp "$BUNDLE/dmg/Storyteller Server_${VERSION}_aarch64.dmg"
      "Storyteller-Server-${VERSION}-aarch64.dmg"
    - cp "$BUNDLE/macos/Storyteller Server.app.tar.gz"
      "Storyteller-Server-${VERSION}-aarch64.app.tar.gz"
    - cp "$BUNDLE/macos/Storyteller Server.app.tar.gz.sig"
      "Storyteller-Server-${VERSION}-aarch64.app.tar.gz.sig"
    # publish to the generic package registry (no release object)
    - export
      PKG_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/storyteller-tauri"
    - 'curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file
      "Storyteller-Server-${VERSION}-aarch64.dmg"
      "$PKG_URL/$VERSION/Storyteller-Server-${VERSION}-aarch64.dmg"'
    - 'curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file
      "Storyteller-Server-${VERSION}-aarch64.app.tar.gz"
      "$PKG_URL/$VERSION/Storyteller-Server-${VERSION}-aarch64.app.tar.gz"'
    - 'curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file
      "Storyteller-Server-${VERSION}-aarch64.app.tar.gz.sig"
      "$PKG_URL/$VERSION/Storyteller-Server-${VERSION}-aarch64.app.tar.gz.sig"'
    # advance the updater feed for stable versions only; re-uploads to the
    # same path are fine (generic registry serves the newest file)
    - |
      if echo "$VERSION" | grep -qvE '\-(alpha|beta|rc|experimental|dev|test|preview)'; then
        node -e "
          const fs = require('fs')
          fs.writeFileSync('latest.json', JSON.stringify({
            version: process.env.VERSION,
            pub_date: new Date().toISOString().replace(/\.\d+Z$/, 'Z'),
            platforms: {
              'darwin-aarch64': {
                signature: fs.readFileSync('Storyteller-Server-' + process.env.VERSION + '-aarch64.app.tar.gz.sig', 'utf8').trim(),
                url: process.env.PKG_URL + '/' + process.env.VERSION + '/Storyteller-Server-' + process.env.VERSION + '-aarch64.app.tar.gz',
              },
            },
          }, null, 2))
        "
        cat latest.json
        curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file latest.json "$PKG_URL/latest/latest.json"
      else
        echo "prerelease $VERSION — not advancing latest.json"
      fi

publish-tauri-linux:
  extends: .publish-tauri
  tags: [saas-linux-medium-amd64]
  image: node:24
  timeout: 2h
  variables:
    # appimage tooling (linuxdeploy/appimagetool) cannot mount fuse inside
    # docker, run it extracted instead
    APPIMAGE_EXTRACT_AND_RUN: "1"
    NO_STRIP: "true"
  script:
    - export VERSION="${CI_COMMIT_TAG#tauri-}"
    - export VERSION="${VERSION#v}"
    - PKG_VERSION=$(node -p
      "require('./applications/tauri/package.json').version")
    - |
      if [ "$VERSION" != "$PKG_VERSION" ]; then
        echo "tag says $VERSION but applications/tauri/package.json says $PKG_VERSION"
        exit 1
      fi
    # webkit2gtk + friends for tauri, cmake/python3 mirror the docker builder
    # base image, git-lfs for the align prebuilds (node:24 has no lfs, so
    # checkout leaves pointer files). sqlite headers come from better-sqlite3
    - apt-get update
    - apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
      libxdo-dev patchelf file desktop-file-utils build-essential cmake python3
      wget curl unzip xz-utils git-lfs
    - git lfs install --local && git lfs pull
    # rustup honors CARGO_HOME, so cargo lands in $CARGO_HOME/bin
    - command -v cargo || (curl --proto '=https' --tlsv1.2 -sSf
      https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain
      stable)
    - export PATH="$CARGO_HOME/bin:$HOME/.cargo/bin:$PATH"
    - cargo --version
    - corepack enable
    - yarn install --immutable
    - cd applications/tauri
    - yarn fetch-binaries
    - yarn assemble-runtime
    # - yarn tauri build --bundles deb,rpm,appimage
    - yarn tauri build --bundles appimage
    - cd "$CI_PROJECT_DIR"
    # bundle filenames vary by tauri version, glob them into url-safe names
    - BUNDLE=applications/tauri/src-tauri/target/release/bundle
    # - cp "$BUNDLE"/deb/*.deb "Storyteller-Server-${VERSION}-amd64.deb"
    # - cp "$BUNDLE"/rpm/*.rpm "Storyteller-Server-${VERSION}-x86_64.rpm"
    - cp "$BUNDLE"/appimage/*.AppImage
      "Storyteller-Server-${VERSION}-amd64.AppImage"
    - export
      PKG_URL="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/storyteller-tauri"
    # - 'curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file
    #   "Storyteller-Server-${VERSION}-amd64.deb"
    # "$PKG_URL/$VERSION/Storyteller-Server-${VERSION}-amd64.deb"'
    # - 'curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file
    #   "Storyteller-Server-${VERSION}-x86_64.rpm"
    #   "$PKG_URL/$VERSION/Storyteller-Server-${VERSION}-x86_64.rpm"'
    - 'curl --fail -H "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file
      "Storyteller-Server-${VERSION}-amd64.AppImage"
      "$PKG_URL/$VERSION/Storyteller-Server-${VERSION}-amd64.AppImage"'
